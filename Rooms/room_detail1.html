                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
            </div>

            <!-- 3. MỤC TIỆN NGHI KHÁCH SẠN -->
            <div class="accordion-item active">
                <div class="accordion-header">
                    <div class="accordion-title">
                        <i class="fa-solid fa-list-alt icon-info"></i>
                        <span>Tiện nghi khách sạn</span>
                    </div>
                    <i class="fa-solid fa-chevron-up arrow-icon"></i>
                </div>

                <div class="amenities-grid">
                    <div class="amenity-card">
                        <i class="fa-solid fa-child-reaching amenity-icon"></i>
                        <span class="amenity-name">Cũi Em Bé</span>
                    </div>
                    <div class="amenity-card">

                        <span class="amenity-name">Đặt Vé Máy Bay</span>
                    </div>
                    <div class="amenity-card">
                        <i class="fa-solid fa-car amenity-icon"></i>
                        <span class="amenity-name">Ôtô Có Thu Phí</span>

                        <i class="fa-solid fa-shirt amenity-icon"></i>
                        <span class="amenity-name">Dịch Vụ Giặt Là Theo Yêu Cầu</span>
                    </div>
                    <div class="amenity-card">
                        <i class="fa-solid fa-tv amenity-icon"></i>

                    </div>

        <!-- CỘT BÊN PHẢI: BOX ĐẶT PHÒNG & THÔNG TIN NHO NHỎ -->
        <div class="right-column">
            <div class="booking-box">
                
                <!-- Thanh chuyển Tab -->
                <div class="tab-header">
                    <button class="tab-btn active" onclick="switchTab('booking-tab', this)">Đặt phòng</button>
                    <button class="tab-btn" onclick="switchTab('info-tab', this)">Thông tin</button>
                </div>

                <!-- TAB 1: ĐẶT PHÒNG -->
                <div id="booking-tab" class="tab-content active">
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label>Chọn hạng phòng <span class="required">*</span></label>
                            <select required>
                                <option value="" disabled selected>Chọn hạng phòng</option>
                                <option value="standard">Phòng Standard</option>
                                <option value="superior">Phòng Superior</option>
                                <option value="deluxe">Phòng Deluxe</option>
                                <option value="suite">Phòng VIP / Suite</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Ngày giờ nhận phòng <span class="required">*</span></label>
                            <input type="datetime-local" value="2026-10-19T18:30" required>
                        </div>

                        <button type="submit" class="btn-booking-submit">ĐẶT BÂY GIỜ</button>
                    </form>
                </div>

                <!-- TAB 2: THÔNG TIN -->
                <div id="info-tab" class="tab-content">
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label>Họ & Tên <span class="required">*</span></label>
                            <input type="text" placeholder="" required>
                        </div>

                        <div class="form-group">
                            <label>Địa chỉ email<span class="required">*</span></label>
                            <input type="email" placeholder="" required>
                        </div>

                        <div class="form-group">
                            <label>Số điện thoại<span class="required">*</span></label>
                            <input type="tel" placeholder="" required>
                        </div>

                        <button type="submit" class="btn-booking-submit">GỬI YÊU CẦU</button>
                    </form>
                </div>

            </div>
        </div>

    </div>

    <!-- Script chuyển đổi tab Đặt phòng <-> Thông tin -->
    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }
    </script>
